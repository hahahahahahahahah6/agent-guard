[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-guard-hooks"
version = "0.7.0"
description = "Behavior-guardrail hooks for Claude Code, Codex CLI and Gemini CLI: test-tampering + outbound-action guards, gate-liveness verification, and mutation test-honesty"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hao li" }]
keywords = ["claude-code", "hooks", "ai-agents", "guardrails", "developer-tools"]

[project.scripts]
agent-guard = "agent_guard.cli:main"

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/agent-guard"

[tool.setuptools.packages.find]
where = ["src"]
